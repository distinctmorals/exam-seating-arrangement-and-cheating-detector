<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Cheating Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6 bg-white rounded-lg shadow-lg max-w-4xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Exam Proctoring System</h1>
        <div class="mb-4">
            <label for="cameraSelect" class="block text-sm font-medium text-gray-700">Select Camera:</label>
            <select id="cameraSelect" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
        <div class="video-grid">
            <!-- Video stream will be dynamically added here -->
        </div>
        <div id="status" class="status flex items-center justify-center p-4 rounded-md mb-4">
            <span id="statusIcon" class="mr-2"></span>
            <span id="statusText">Initializing...</span>
        </div>
        <div id="incidents" class="bg-gray-50 p-4 rounded-md">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-gray-700">Detected Incidents</h2>
                <button id="toggleIncidents" class="text-blue-600 hover:text-blue-800 text-sm">Show/Hide</button>
            </div>
            <ul id="incident-list" class="mt-2 space-y-2 hidden"></ul>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Cheating Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <!-- Login Form -->
        <div id="login-form">
            <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label for="login-username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="login-username" name="username" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="login-password" name="password" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700">Login</button>
                <p class="mt-4 text-center text-sm">
                    Don't have an account? <a href="#" onclick="toggleForm('signup')" class="text-indigo-600 hover:underline">Sign up</a>
                </p>
            </form>
        </div>
        <!-- Signup Form -->
        <div id="signup-form" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-center">Sign Up</h2>
            <form action="/signup" method="POST" class="space-y-4">
                <div>
                    <label for="signup-username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="signup-username" name="username" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="signup-password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="signup-password" name="password" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700">Sign Up</button>
                <p class="mt-4 text-center text-sm">
                    Already have an account? <a href="#" onclick="toggleForm('login')" class="text-indigo-600 hover:underline">Login</a>
                </p>
            </form>
        </div>
    </div>
    <script>
        function toggleForm(form) {
            document.getElementById('login-form').classList.toggle('hidden', form !== 'login');
            document.getElementById('signup-form').classList.toggle('hidden', form !== 'signup');
            console.log(`Toggled to ${form} form`);
        }

        // Handle success/error messages and show login form after signup
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('message')) {
            alert(urlParams.get('message'));
            toggleForm('login');
            window.history.replaceState({}, document.title, "/");
            console.log('Processed URL message and switched to login form');
        }
    </script>
</body>
</html>
